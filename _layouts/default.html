<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body class="{% if page.url == '/' %}page-home{% endif %}">
  {% include nav.html %}
  {{ content }}
  {% include footer.html %}

  <script>
    // Scroll-triggered fade-in
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

    document.querySelectorAll('.fade-in, .fade-in-stagger').forEach(el => observer.observe(el));

    // Count-up animation for stats
    const isMostlyVisible = (el, ratio = 0.6) => {
      const rect = el.getBoundingClientRect();
      const viewportH = window.innerHeight || document.documentElement.clientHeight;
      const visibleTop = Math.max(rect.top, 0);
      const visibleBottom = Math.min(rect.bottom, viewportH);
      const visibleHeight = Math.max(0, visibleBottom - visibleTop);
      return rect.height > 0 && (visibleHeight / rect.height) >= ratio;
    };

    const statsObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting || !isMostlyVisible(entry.target)) return;
        entry.target.querySelectorAll('.stat-number[data-count]').forEach(el => {
          const target = parseInt(el.dataset.count, 10);
          const suffix = el.dataset.suffix || '';
          const duration = 1500;
          const start = performance.now();
          function tick(now) {
            const progress = Math.min((now - start) / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.round(eased * target) + suffix;
            if (progress < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        });
        statsObserver.unobserve(entry.target);
      });
    }, { threshold: [0.25, 0.6] });

    document.querySelectorAll('.stats-panel-wrap, .stats-strip').forEach(el => statsObserver.observe(el));

    // Nav becomes solid shortly after scrolling starts
    const siteNav = document.querySelector('.site-nav');
    const hero = document.querySelector('.hero, .page-hero');
    if (siteNav && hero) {
      const syncNavState = () => {
        const scrolled = window.scrollY || window.pageYOffset || 0;
        siteNav.classList.toggle('nav-solid', scrolled > 8);
      };

      syncNavState();
      window.addEventListener('scroll', syncNavState, { passive: true });
      window.addEventListener('resize', syncNavState);
    }

    // Circle bubble force-push interaction
    const cluster = document.getElementById('circles-cluster');
    if (cluster) {
      const bubbles = Array.from(cluster.querySelectorAll('.circle-bubble'));
      const ghosts = Array.from(cluster.querySelectorAll('.circle-ghost'));
      const forceNodes = [...bubbles, ...ghosts];

      const resetAll = () => {
        forceNodes.forEach(node => {
          node.style.setProperty('--tx', '0px');
          node.style.setProperty('--ty', '0px');
        });
      };

      const pushFrom = (hovered) => {
        if (window.matchMedia('(max-width: 640px)').matches) return;
        const hr = hovered.getBoundingClientRect();
        const hcx = hr.left + hr.width / 2;
        const hcy = hr.top + hr.height / 2;
        const hoveredRadius = hr.width / 2;
        // The scaled radius (hover scale factor matches CSS --scale on hover)
        const scaledRadius = hoveredRadius * 1.45;

        forceNodes.forEach(other => {
          if (other === hovered) return;
          const or = other.getBoundingClientRect();
          const ocx = or.left + or.width / 2;
          const ocy = or.top + or.height / 2;
          const otherRadius = or.width / 2;

          const dx = ocx - hcx;
          const dy = ocy - hcy;
          const dist = Math.hypot(dx, dy) || 0.01;

          // How much overlap would there be with scaled hovered circle?
          const wanted = scaledRadius + otherRadius + 6; // 6px breathing room
          const push = Math.max(0, wanted - dist);

          const tx = (dx / dist) * push;
          const ty = (dy / dist) * push;
          other.style.setProperty('--tx', tx.toFixed(1) + 'px');
          other.style.setProperty('--ty', ty.toFixed(1) + 'px');
        });
      };

      bubbles.forEach(b => {
        b.addEventListener('mouseenter', () => pushFrom(b));
        b.addEventListener('focus', () => pushFrom(b));
        b.addEventListener('mouseleave', resetAll);
        b.addEventListener('blur', resetAll);
      });
    }

    // Freeze hero video on last frame
    const heroVideo = document.getElementById('hero-video');
    if (heroVideo) {
      heroVideo.addEventListener('ended', () => {
        heroVideo.pause();
      });
    }

    // ─── SPOTLIGHT SECTIONS — tabbed feature band (_includes/spotlight.html) ───
    (() => {
      const DURATION = 6000;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      document.querySelectorAll('[data-spotlight]').forEach((root) => {
        const triggers = Array.from(root.querySelectorAll('.spotlight__trigger'));
        const panels   = Array.from(root.querySelectorAll('.spotlight__panel'));
        if (!triggers.length || triggers.length !== panels.length) return;

        let idx = 0, timer = null, paused = false;

        // Restart the underline fill that times the auto-advance
        const arm = (i) => {
          if (reducedMotion || paused) return;
          void triggers[i].offsetWidth;
          triggers[i].classList.add('is-timing');
        };

        const setActive = (i) => {
          idx = i;
          triggers.forEach((t, n) => {
            const on = n === i;
            t.classList.toggle('is-active', on);
            t.classList.remove('is-timing');
            t.setAttribute('aria-selected', on ? 'true' : 'false');
            t.tabIndex = on ? 0 : -1;
          });
          panels.forEach((p, n) => {
            const on = n === i;
            p.classList.toggle('is-active', on);
            p.hidden = !on;
          });
          arm(i);
        };

        const stop  = () => { if (timer) { clearInterval(timer); timer = null; } };
        const start = () => {
          if (reducedMotion || timer) return;
          timer = setInterval(() => { if (!paused) setActive((idx + 1) % triggers.length); }, DURATION);
        };
        const restart = () => { stop(); start(); };

        triggers.forEach((t, i) => {
          t.addEventListener('click', () => { setActive(i); restart(); });
          t.addEventListener('keydown', (e) => {
            const last = triggers.length - 1;
            let next = null;
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') next = idx === last ? 0 : idx + 1;
            if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  next = idx === 0 ? last : idx - 1;
            if (e.key === 'Home') next = 0;
            if (e.key === 'End')  next = last;
            if (next === null) return;
            e.preventDefault();
            setActive(next);
            triggers[next].focus();
            restart();
          });
        });

        root.addEventListener('mouseenter', () => { paused = true; triggers[idx].classList.remove('is-timing'); });
        root.addEventListener('mouseleave', () => { paused = false; arm(idx); });
        root.addEventListener('focusin',    () => { paused = true; triggers[idx].classList.remove('is-timing'); });
        root.addEventListener('focusout',   () => { paused = false; arm(idx); });

        root.style.setProperty('--spotlight-duration', DURATION + 'ms');
        setActive(0);
        start();
      });
    })();
  </script>
</body>
</html>
