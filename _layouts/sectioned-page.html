---
layout: default
---

{% if page.css %}<link rel="stylesheet" href="{{ page.css | relative_url }}">{% endif %}

<header class="page-hero">
  <div class="container">
    {% if page.eyebrow %}<span class="hero-label">{{ page.eyebrow }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </div>
</header>

{% for section in page.sections %}
  {% include page-section.html section=section %}
{% endfor %}

{{ content }}
