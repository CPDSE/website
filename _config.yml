title: CPDSE
description: Center for Pharmaceutical Data Science Education
tagline: Pharma is full of data, but not data science. We are here to change that.
baseurl: ""
url: "https://cpdse.dk"

markdown: kramdown
permalink: /news/:title/
future: true

collections:
  projects:
    output: true
    permalink: /project-opportunities/:title/
  perspectives:
    output: true
    permalink: /perspectives/:title/

defaults:
  - scope:
      path: ""
      type: perspectives
    values:
      layout: perspective

# jekyll-feed: the default /feed.xml covers news posts; Perspectives gets its own feed
feed:
  collections:
    perspectives:
      path: "/perspectives/feed.xml"

exclude:
  - _posts/news/_template.md   # reference template, not a real post
  - _projects/_template.md     # reference template, not a real project
  - _perspectives/_template.md # reference template, not a real perspective
  - scripts/                   # data-refresh scripts, not site content
  - _preview/                  # local preview harness
  - docs/                      # internal reference screenshots
  - CLAUDE.md                  # repo-only guidance (stays in git, just not published)
  - README.md                  # repo-only guidance (stays in git, just not published)
  - reference-models/README.md # build notes for the generated reference-models site
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-feed

nav:
  - title: News & Events
    url: /news-events/
  - title: Perspectives
    url: /perspectives/
  - title: About
    children:
      - title: About CPDSE
        url: /about/
      - title: People
        url: /people/
      - title: Researchers & Units
        url: /researchers-units/
      - title: Visual Identity
        url: /visual-identity/
      - title: Join Us
        url: /join-us/
  - title: Resources
    children:
      - title: Learning Resources
        url: /learning-resources/
      - title: AI Drug Design Course
        url: /ai-drug-design-course/
      - title: Educational Git
        url: https://github.com/CPDSE-EDUX
        external: true
      - title: Project Git
        url: https://github.com/CPDSE
        external: true
  - title: Services
    children:
      - title: Curriculum Development
        url: /curriculum-development/
      - title: People Development
        url: /people-development/
      - title: Student Code Club
        url: /codeclub/
  - title: Contact
    url: /contact/

socials:
  linkedin: https://www.linkedin.com/company/centre-for-pharmaceutical-data-science-education
  instagram: https://www.instagram.com/cpdse.dk/
  github: https://github.com/CPDSE-EDUX
